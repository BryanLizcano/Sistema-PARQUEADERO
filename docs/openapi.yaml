components:
  schemas:
    AniosDisponiblesResponse:
      properties:
        anios:
          items:
            type: integer
          type: array
          title: Anios
      type: object
      required:
        - anios
      title: AniosDisponiblesResponse
    AuditoriaOut:
      properties:
        id:
          type: string
          title: Id
        quien:
          type: string
          title: Quien
        accion:
          type: string
          title: Accion
        entidad:
          type: string
          title: Entidad
        entidad_id:
          anyOf:
            - type: string
            - type: "null"
          title: "Entidad Id"
        antes:
          anyOf:
            - type: string
            - type: "null"
          title: Antes
        despues:
          anyOf:
            - type: string
            - type: "null"
          title: Despues
        fecha:
          type: string
          format: date-time
          title: Fecha
      type: object
      required:
        - id
        - quien
        - accion
        - entidad
        - fecha
      title: AuditoriaOut
    AuditoriaPaginadaResponse:
      properties:
        data:
          items:
            "$ref": "#/components/schemas/AuditoriaOut"
          type: array
          title: Data
        page:
          type: integer
          title: Page
        limit:
          type: integer
          title: Limit
        total:
          type: integer
          title: Total
        totalPages:
          type: integer
          title: Totalpages
      type: object
      required:
        - data
        - page
        - limit
        - total
        - totalPages
      title: AuditoriaPaginadaResponse
    CambiarPasswordRequest:
      properties:
        password_actual:
          type: string
          maxLength: 72
          minLength: 1
          title: "Password Actual"
        password_nueva:
          type: string
          maxLength: 72
          minLength: 4
          title: "Password Nueva"
      type: object
      required:
        - password_actual
        - password_nueva
      title: CambiarPasswordRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            "$ref": "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        nombre:
          type: string
          maxLength: 100
          minLength: 1
          title: Nombre
        password:
          type: string
          maxLength: 72
          minLength: 1
          title: Password
      type: object
      required:
        - nombre
        - password
      title: LoginRequest
    LoginResponse:
      properties:
        usuario:
          "$ref": "#/components/schemas/UsuarioOut"
        expira:
          type: string
          format: date-time
          title: Expira
      type: object
      required:
        - usuario
        - expira
      title: LoginResponse
    MeResponse:
      properties:
        id:
          type: string
          title: Id
        nombre:
          type: string
          title: Nombre
        rol:
          type: string
          title: Rol
        activo:
          type: boolean
          title: Activo
        expira:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Expira
      type: object
      required:
        - id
        - nombre
        - rol
        - activo
      title: MeResponse
    MessageResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
        - detail
      title: MessageResponse
    RegistrosPaginadosResponse:
      properties:
        data:
          items:
            "$ref": "#/components/schemas/Ticket"
          type: array
          title: Data
        page:
          type: integer
          title: Page
        limit:
          type: integer
          title: Limit
        total:
          type: integer
          title: Total
        totalPages:
          type: integer
          title: Totalpages
      type: object
      required:
        - data
        - page
        - limit
        - total
        - totalPages
      title: RegistrosPaginadosResponse
    Ticket:
      properties:
        placa:
          type: string
          pattern: "^[A-Z0-9-]+$"
          title: Placa
        id_tipo_vehiculo:
          type: string
          title: "Id Tipo Vehiculo"
        id:
          type: string
          title: Id
        nombre_parqueadero:
          type: string
          title: "Nombre Parqueadero"
        fecha_ingreso:
          type: string
          format: date-time
          title: "Fecha Ingreso"
        fecha_salida:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: "Fecha Salida"
        total_horas:
          anyOf:
            - type: number
            - type: "null"
          title: "Total Horas"
        precio_total:
          anyOf:
            - type: number
            - type: "null"
          title: "Precio Total"
        precio_calculado:
          anyOf:
            - type: number
            - type: "null"
          title: "Precio Calculado"
        precio_final:
          anyOf:
            - type: number
            - type: "null"
          title: "Precio Final"
        motivo_ajuste:
          anyOf:
            - type: string
            - type: "null"
          title: "Motivo Ajuste"
        eliminado:
          type: boolean
          title: Eliminado
          default: false
        estado:
          type: string
          title: Estado
          default: ACTIVO
      type: object
      required:
        - placa
        - id_tipo_vehiculo
        - id
        - nombre_parqueadero
        - fecha_ingreso
      title: Ticket
    TicketCreate:
      properties:
        placa:
          type: string
          pattern: "^[A-Z0-9-]+$"
          title: Placa
        id_tipo_vehiculo:
          type: string
          title: "Id Tipo Vehiculo"
        nombre_parqueadero:
          anyOf:
            - type: string
            - type: "null"
          title: "Nombre Parqueadero"
          default: "PARQUEADERO BAHONDO"
      type: object
      required:
        - placa
        - id_tipo_vehiculo
      title: TicketCreate
    TicketEditarPrecio:
      properties:
        precio_final:
          type: number
          minimum: 0.0
          title: "Precio Final"
        motivo_ajuste:
          type: string
          maxLength: 255
          minLength: 1
          title: "Motivo Ajuste"
      type: object
      required:
        - precio_final
        - motivo_ajuste
      title: TicketEditarPrecio
    TicketSalida:
      properties:
        precio_personalizado:
          anyOf:
            - type: number
              minimum: 0.0
            - type: "null"
          title: "Precio Personalizado"
        motivo_ajuste:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
          title: "Motivo Ajuste"
      type: object
      title: TicketSalida
    TicketUpdateAdmin:
      properties:
        placa:
          anyOf:
            - type: string
              pattern: "^[A-Z0-9-]+$"
            - type: "null"
          title: Placa
        id_tipo_vehiculo:
          anyOf:
            - type: string
            - type: "null"
          title: "Id Tipo Vehiculo"
        nombre_parqueadero:
          anyOf:
            - type: string
              maxLength: 120
              minLength: 1
            - type: "null"
          title: "Nombre Parqueadero"
        precio_final:
          anyOf:
            - type: number
              minimum: 0.0
            - type: "null"
          title: "Precio Final"
        motivo_ajuste:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
          title: "Motivo Ajuste"
      type: object
      title: TicketUpdateAdmin
    TipoVehiculo:
      properties:
        nombre:
          type: string
          pattern: "^[A-ZÑ\\s]+$"
          title: Nombre
        tarifa_hora:
          type: number
          minimum: 0.0
          title: "Tarifa Hora"
        tarifa_dia:
          type: number
          minimum: 0.0
          title: "Tarifa Dia"
        tarifa_noche:
          type: number
          minimum: 0.0
          title: "Tarifa Noche"
        id:
          type: string
          title: Id
      type: object
      required:
        - nombre
        - tarifa_hora
        - tarifa_dia
        - tarifa_noche
        - id
      title: TipoVehiculo
    TipoVehiculoCreate:
      properties:
        nombre:
          type: string
          pattern: "^[A-ZÑ\\s]+$"
          title: Nombre
        tarifa_hora:
          type: number
          minimum: 0.0
          title: "Tarifa Hora"
        tarifa_dia:
          type: number
          minimum: 0.0
          title: "Tarifa Dia"
        tarifa_noche:
          type: number
          minimum: 0.0
          title: "Tarifa Noche"
      type: object
      required:
        - nombre
        - tarifa_hora
        - tarifa_dia
        - tarifa_noche
      title: TipoVehiculoCreate
    UsuarioOut:
      properties:
        id:
          type: string
          title: Id
        nombre:
          type: string
          title: Nombre
        rol:
          type: string
          title: Rol
        activo:
          type: boolean
          title: Activo
        creado:
          type: string
          format: date-time
          title: Creado
      type: object
      required:
        - id
        - nombre
        - rol
        - activo
        - creado
      title: UsuarioOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: "Error Type"
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    ErrorDetail:
      type: object
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          example: NO_AUTENTICADO
        mensaje:
          type: string
          example: "No autenticado o sesión expirada"
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          "$ref": "#/components/schemas/ErrorDetail"
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: "Sesión emitida por POST /api/auth/login (HttpOnly, SameSite=Strict, sin JWT)."
